<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dragonbound II</title>
<meta name="theme-color" content="#140d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dragonbound II">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../dragonbound/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Dark-fantasy party RPG: dusk purple backdrop, parchment-and-gold panels, full-screen battle stage with the party facing a wave. Portrait: controls below the stage; landscape: controls on the right. */
:root {
  --bg: #140d18; --panel: #2a1c22; --panel2: #3a2730; --line: #6b4a2e;
  --gold: #f2b632; --gold2: #ffd76a; --parch: #f6e7c4; --ink: #2a1a0e; --muted: #c9b48f;
  --hp: #e0413b; --mp: #3d8be0; --xp: #5cb85c; --ult: #ffb02e;
  --fd: "Lilita One", "Nunito", system-ui, sans-serif; --fb: "Nunito", system-ui, -apple-system, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-l: env(safe-area-inset-left, 0px);
  --pw: min(340px, 44vw);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; font-family: var(--fb); font-weight: 800; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body { display: flex; justify-content: center; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: default; }
img { -webkit-user-drag: none; user-select: none; }
.app { width: 100%; max-width: 520px; min-height: 100%; padding: calc(var(--safe-t) + 10px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 14px); background: radial-gradient(120% 60% at 50% 0%, #3a2140 0%, transparent 70%), linear-gradient(#1a1020, var(--bg)); }
.app[hidden] { display: none; }

/* ---------- Home ---------- */
.top { display: flex; align-items: center; gap: 8px; }
.logo { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo img { height: 44px; filter: drop-shadow(0 2px 4px #000); }
.logo .two { font-family: var(--fd); font-size: 26px; color: var(--gold2); text-shadow: 0 2px 0 #6a3b0a, 0 0 12px rgba(255,180,60,.5); }
.pill { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.45); border: 2px solid var(--line); border-radius: 99px; padding: 3px 10px 3px 4px; font-size: 14px; }
.pill img { width: 22px; height: 22px; object-fit: contain; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.5); border: 2px solid var(--line); display: grid; place-items: center; font-size: 18px; flex: none; }
.tabs { display: flex; gap: 6px; margin-top: 12px; } .tabs button { flex: 1; padding: 7px 4px; border-radius: 12px 12px 0 0; background: rgba(0,0,0,.4); border: 2px solid var(--line); border-bottom: 0; font-size: 13px; color: var(--muted); } .tabs button.on { background: var(--panel); color: var(--gold2); border-color: var(--gold); } .tabs button:disabled { opacity: .45; }
.chap { margin-top: 0; border-radius: 18px; overflow: hidden; border: 3px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.5); background: var(--panel); }
.chap .ban { position: relative; height: 128px; background-size: cover; background-position: center 60%; }
.chap .ban::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(20,13,24,.95)); }
.chap .ban div { position: absolute; left: 14px; bottom: 10px; z-index: 1; }
.chap .ban small { display: block; color: var(--muted); font-size: 13px; letter-spacing: .5px; }
.chap .ban b { font-family: var(--fd); font-weight: 400; font-size: 26px; color: var(--gold2); text-shadow: 0 2px 0 #000; }
.path { position: relative; display: flex; justify-content: space-between; padding: 18px 14px 14px; }
.path::before { content: ""; position: absolute; left: 36px; right: 36px; top: 46px; border-top: 4px dashed rgba(242,182,50,.35); }
.node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px; }
.node .disc { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--fd); font-size: 24px; background: radial-gradient(circle at 50% 35%, #7a5a40, #3a2418); border: 3px solid var(--gold); box-shadow: 0 4px 0 #1a0e08, 0 0 0 3px rgba(0,0,0,.35); color: #fff; text-shadow: 0 2px 0 #000; overflow: hidden; }
.node.boss .disc { width: 62px; height: 62px; border-color: #d04a3a; background: radial-gradient(circle at 50% 35%, #6a2a3a, #2a0e14); }
.node.boss .disc img { width: 120%; height: 120%; object-fit: cover; object-position: 50% 15%; }
.node.lock .disc { filter: grayscale(1) brightness(.55); border-color: #6b6b6b; }
.node.cur .disc { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 4px 0 #1a0e08, 0 0 0 3px rgba(0,0,0,.35), 0 0 22px 6px rgba(255,200,80,.75); } }
.node .stars { font-size: 12px; letter-spacing: -1px; color: var(--gold2); min-height: 16px; }
.node .stars i { font-style: normal; opacity: .3; } .node .stars i.on { opacity: 1; }
.node .nm { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.1; }
h2 { font-family: var(--fd); font-weight: 400; font-size: 21px; margin: 20px 0 8px; color: var(--gold2); display: flex; align-items: center; justify-content: space-between; text-shadow: 0 2px 0 #000; }
h2 button { font-family: var(--fb); font-size: 13px; background: var(--panel2); border: 2px solid var(--line); border-radius: 99px; padding: 5px 12px; color: var(--parch); }
.party { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pc { background: linear-gradient(var(--panel2), var(--panel)); border: 2px solid var(--line); border-radius: 14px; padding: 8px 6px; text-align: center; position: relative; }
.pc img { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--gold); background: #2a1a24; object-fit: cover; display: block; margin: 0 auto 4px; }
.pc.empty { display: grid; place-items: center; color: #7a6a7a; font-size: 12px; border-style: dashed; min-height: 150px; }
.pc.empty span { font-size: 30px; display: block; }
.pc b { font-family: var(--fd); font-weight: 400; font-size: 17px; display: block; }
.pc small { display: block; font-size: 12px; color: var(--muted); }
.role { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-top: 3px; color: #fff; }
.role.tank { background: #8a3a2a; } .role.heal { background: #2f7a3a; } .role.dps { background: #3a4fa8; } .role.ranged { background: #6a7a2a; } .role.crit { background: #5a3a8a; }
.xpb { height: 6px; border-radius: 99px; background: rgba(0,0,0,.5); margin-top: 5px; overflow: hidden; } .xpb i { display: block; height: 100%; background: var(--xp); }
.bench { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bench img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); object-fit: cover; background: #2a1a24; }
.menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.big { display: flex; align-items: center; gap: 10px; background: linear-gradient(#4a3226, #2c1c16); border: 3px solid var(--gold); border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 0 #160c06; font-family: var(--fd); font-size: 19px; }
.big img { width: 40px; height: 40px; object-fit: contain; }
.big:active, .act:active:not(:disabled), .btn:active { transform: translateY(2px); }
.ver { text-align: center; color: #6a5a6a; font-size: 12px; margin-top: 22px; }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8,4,10,.72); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.sheet { width: 100%; max-width: 420px; max-height: 88vh; overflow: auto; background: linear-gradient(#f9ecd0, #ead2a0); color: var(--ink); border: 4px solid var(--gold); border-radius: 20px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px #8a5a34; animation: pop .25s cubic-bezier(.2,1.4,.5,1); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.sheet h3 { font-family: var(--fd); font-weight: 400; font-size: 26px; margin: 0 0 8px; text-align: center; color: #6a2a0a; }
.sheet p { margin: 6px 0; font-weight: 700; line-height: 1.35; }
.btn { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 14px; font-family: var(--fd); font-size: 20px; color: #fff; background: linear-gradient(#5cb85c, #2f7a3a); border: 3px solid #1e4a22; box-shadow: 0 4px 0 #143018; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.btn.alt { background: linear-gradient(#9a7a5a, #6a4a32); border-color: #3a2416; box-shadow: 0 4px 0 #2a180c; }
.btn.red { background: linear-gradient(#e0614b, #a8302a); border-color: #5a1810; box-shadow: 0 4px 0 #3a0e08; }
.btn:disabled { filter: grayscale(.8) brightness(.8); }
.foes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.foes img { width: 54px; height: 54px; object-fit: contain; background: rgba(0,0,0,.12); border-radius: 12px; padding: 3px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: rgba(255,255,255,.45); margin-top: 8px; }
.row img.f { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #8a5a34; object-fit: cover; flex: none; background: #3a2a30; }
.row .grow { flex: 1; min-width: 0; }
.row .grow small { display: block; font-weight: 700; color: #6a4a2a; font-size: 12px; }
.row button { flex: none; padding: 7px 10px; border-radius: 10px; background: linear-gradient(#f2b632, #c07a12); border: 2px solid #6a3b0a; color: #2a1406; font-weight: 900; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.row button img { width: 18px; height: 18px; }
.row button:disabled { filter: grayscale(1); opacity: .6; }
.pick { position: relative; cursor: pointer; }
.pick.on { background: rgba(92,184,92,.35); outline: 3px solid #2f7a3a; }
.pick.locked { opacity: .55; }
.say { display: flex; gap: 10px; align-items: flex-start; min-height: 90px; }
.say img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #8a5a34; object-fit: cover; flex: none; background: #3a2a30; }
.say .t { flex: 1; } .say .t b { font-family: var(--fd); font-weight: 400; color: #6a2a0a; font-size: 18px; }
.say.narr .t { font-style: italic; text-align: center; padding-top: 8px; }
.lvup { color: #2f7a3a; font-family: var(--fd); font-weight: 400; }

/* ---------- Battle ---------- */
#fight { position: fixed; inset: 0; z-index: 30; background: #0c0810; }
#fight[hidden] { display: none; }
.fwrap { width: 100%; max-width: 560px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.ftop { position: absolute; top: calc(var(--safe-t) + 6px); left: calc(var(--safe-l) + 8px); right: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.ftop > * { pointer-events: auto; }
.ftitle { flex: 1; text-align: center; text-shadow: 0 2px 3px #000, 0 0 8px #000; }
.ftitle b { display: block; font-family: var(--fd); font-weight: 400; font-size: 17px; color: var(--gold2); }
.ftitle span { font-size: 12px; color: #e8dcc8; }
#autoBtn { padding: 6px 12px; border-radius: 99px; background: rgba(0,0,0,.55); border: 2px solid var(--line); font-size: 13px; }
#autoBtn.on { background: linear-gradient(#f2b632, #c07a12); color: #2a1406; border-color: #6a3b0a; }
#cv { flex: 1 1 auto; width: 100%; min-height: 0; display: block; touch-action: manipulation; }
.fpanel { flex: none; background: linear-gradient(#2c1d20, #170f14); border-top: 3px solid var(--gold); box-shadow: 0 -6px 20px rgba(0,0,0,.6); padding: 6px 6px calc(var(--safe-b) + 6px); }
#msg { min-height: 19px; text-align: center; font-size: 13px; color: var(--parch); margin-bottom: 5px; line-height: 1.25; }
#msg b { color: var(--gold2); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.card { padding: 4px 5px 3px; border-radius: 10px; background: rgba(0,0,0,.35); border: 2px solid #4a3426; transition: transform .15s, border-color .15s, box-shadow .15s; min-width: 0; }
.card .ch { display: flex; align-items: center; gap: 4px; min-width: 0; }
.card .ch img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 2px solid #8a6a40; flex: none; background: #3a2a30; }
.card .ch b { flex: 1; min-width: 0; font-family: var(--fd); font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .ch span { font-size: 10.5px; flex: none; color: #e8dcc8; }
.bar { position: relative; height: 7px; border-radius: 99px; background: rgba(0,0,0,.6); overflow: hidden; margin-top: 3px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; transition: width .3s; }
.bar.hp i { background: linear-gradient(#ff7a6a, var(--hp)); } .bar.mp i { background: linear-gradient(#7ab4ff, var(--mp)); } .bar.lb i { background: linear-gradient(#ffe08a, var(--ult)); }
.bar.hp i.low { background: linear-gradient(#ffb36a, #e07a1b); } .bar.lb.full i { animation: shine .8s linear infinite; } @keyframes shine { 50% { filter: brightness(1.6); } }
.bar.mp, .bar.lb { height: 5px; margin-top: 2px; }
.card .num { font-size: 10px; color: #e8dcc8; margin-top: 1px; display: flex; justify-content: space-between; }
.card.on { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,200,80,.6); transform: translateY(-2px); }
.card.dead { filter: grayscale(1) brightness(.6); }
.card.tgt { border-color: #5cb85c; box-shadow: 0 0 14px rgba(92,184,92,.8); animation: pulse .8s ease-in-out infinite; cursor: pointer; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.acts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px 2px; margin-top: 6px; min-height: 128px; align-content: start; }
.act { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10.5px; line-height: 1.05; text-align: center; color: #f3e6cc; text-shadow: 0 1px 2px #000; min-width: 0; }
.act i { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 23px; background: radial-gradient(circle at 50% 35%, #6a4a36, #2a1810); border: 3px solid var(--gold); box-shadow: 0 3px 0 #120a06; overflow: hidden; }
.act i img { width: 100%; height: 100%; object-fit: cover; }
.act i img.poti { object-fit: contain; padding: 4px; }
.act.mag i { border-color: #6aa8ff; } .act.heal i { border-color: #6ad07a; } .act.def i { border-color: #b8c4cc; }
.act .cost, .act .cnt { position: absolute; top: 31px; right: 50%; margin-right: -30px; border-radius: 99px; font-size: 10px; padding: 0 4px; color: #fff; }
.act .cost { background: #10305a; border: 2px solid #6aa8ff; } .act .cnt { background: #3a1a10; border: 2px solid var(--gold); }
.act:disabled { opacity: .36; filter: grayscale(.7); }
.act.sel i { box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,220,120,.9); }
.act.ult i { border-color: var(--ult); background: conic-gradient(rgba(255,176,46,.55) calc(var(--lb) * 1%), rgba(0,0,0,.4) 0), radial-gradient(circle at 50% 35%, #6a4a36, #2a1810); }
.act.ult.ready i { animation: ultglow .9s ease-in-out infinite; } .act.ult.ready { opacity: 1; filter: none; }
@keyframes ultglow { 50% { box-shadow: 0 3px 0 #120a06, 0 0 18px 6px rgba(255,180,50,.95); } }
.waitbar { grid-column: 1 / -1; text-align: center; color: #8a7a8a; font-size: 13px; padding-top: 44px; }
#pop { position: absolute; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 150px); z-index: 4; background: linear-gradient(#3a2730, #21151a); border: 3px solid var(--gold); border-radius: 16px; padding: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
#pop[hidden] { display: none; }
#pop button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; background: rgba(0,0,0,.3); font-size: 12px; }
#pop button img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #3a2a30; }
#pop button:disabled { opacity: .4; }
#pop p { grid-column: 1 / -1; margin: 0; text-align: center; font-size: 13px; color: var(--gold2); }
.toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 60px); transform: translateX(-50%); z-index: 80; background: rgba(20,12,16,.92); border: 2px solid var(--gold); border-radius: 14px; padding: 8px 14px; font-size: 14px; max-width: 90vw; text-align: center; animation: pop .2s; pointer-events: none; }
.poti.mana { filter: hue-rotate(205deg) saturate(1.3); } .poti.eli { filter: hue-rotate(95deg) saturate(1.4) brightness(1.1); } .poti.fea { filter: hue-rotate(-40deg) saturate(1.6) brightness(1.2); }
@media (max-height: 700px) and (orientation: portrait) { .acts { min-height: 116px; } .act i { width: 40px; height: 40px; } .act .cost, .act .cnt { top: 26px; } }
/* Landscape: stage on the left, controls in a column on the right */
@media (orientation: landscape) and (max-height: 600px) {
  .fwrap { max-width: none; flex-direction: row; }
  #cv { width: auto; height: 100%; flex: 1 1 0; min-width: 0; }
  .fpanel { width: var(--pw); height: 100%; overflow-y: auto; border-top: 0; border-left: 3px solid var(--gold); box-shadow: -6px 0 20px rgba(0,0,0,.6); padding: calc(var(--safe-t) + 6px) calc(var(--safe-r) + 6px) calc(var(--safe-b) + 6px) 6px; display: flex; flex-direction: column; }
  .ftop { right: calc(var(--pw) + 8px); }
  .acts { min-height: 0; grid-template-columns: repeat(5, 1fr); }
  .act i { width: 42px; height: 42px; } .act .cost, .act .cnt { top: 28px; }
  #pop { left: auto; right: calc(var(--safe-r) + 8px); width: calc(var(--pw) - 16px); bottom: auto; top: 50%; transform: translateY(-50%); }
}
#title { position: fixed; inset: 0; z-index: 60; background: #000 url(img/intro-end.jpg) center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: calc(var(--safe-b) + 8vh); cursor: pointer; }
#title[hidden] { display: none; }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.1) 50%, rgba(0,0,0,.75)); }
#title > * { position: relative; }
#title img { width: min(70vw, 420px); filter: drop-shadow(0 4px 12px #000); animation: pop .6s cubic-bezier(.2,1.4,.5,1); }
#title .two { font-family: var(--fd); font-size: 40px; color: var(--gold2); text-shadow: 0 3px 0 #6a3b0a, 0 0 16px rgba(255,180,60,.7); margin-top: -10px; }
#title p { font-family: var(--fd); font-size: 20px; margin: 18px 0 0; color: #fff; text-shadow: 0 2px 4px #000; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
#vid { position: fixed; inset: 0; z-index: 70; background: #000; display: grid; place-items: center; }
#vid[hidden] { display: none; }
#vid video { width: 100%; height: 100%; object-fit: contain; }
#vid button { position: absolute; right: calc(var(--safe-r) + 14px); bottom: calc(var(--safe-b) + 14px); padding: 8px 16px; border-radius: 99px; background: rgba(0,0,0,.6); border: 2px solid var(--gold); font-size: 14px; }
.ver button { color: var(--muted); text-decoration: underline; font-size: 12px; margin-left: 6px; }
#spdBtn { padding: 6px 10px; border-radius: 99px; background: rgba(0,0,0,.55); border: 2px solid var(--line); font-size: 13px; min-width: 44px; }
#spdBtn.on { background: linear-gradient(#6aa8ff, #2f5fa8); border-color: #10305a; }
.menu .wide { grid-column: 1 / -1; justify-content: center; position: relative; }
.dot { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 99px; background: #e0413b; border: 2px solid #fff; font: 900 12px var(--fb); display: grid; place-items: center; padding: 0 5px; color: #fff; }
.pc { cursor: pointer; } .pc .dot { top: 4px; right: 4px; }
.item { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: rgba(255,255,255,.5); margin-top: 8px; border: 2px solid var(--rc, #a7a29a); box-shadow: inset 0 0 18px rgba(var(--rg, 167,162,154), .25); }
.item > img { width: 56px; height: 56px; object-fit: contain; flex: none; border-radius: 10px; background: radial-gradient(circle, rgba(var(--rg, 167,162,154), .45), transparent 70%); }
.item .grow { flex: 1; min-width: 0; } .item b { display: block; color: var(--rc); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.item small { display: block; font-size: 11.5px; color: #6a4a2a; } .item .st { font-size: 12.5px; color: #2a1a0e; }

// ---------- Hero AI (Auto button and simulator) ----------
function aiHero(h) {
  const fs = livingF(), hs = livingH(), dead = B.party.filter(x => !alive(x)), can = k => h.mp >= SK[k].cost && h.H.skills.includes(k);
  const weakest = fs.reduce((a, b) => a.hp < b.hp ? a : b), boss = fs.find(f => f.boss), hurt = hs.filter(x => x.hp < x.hpMax * .5).sort((a, b) => a.hp / a.hpMax - b.hp / b.hpMax);
  const healer = hs.some(x => x.id === 'selena');
  if (h.lb >= 100) { const ok = h.id === 'selena' ? (dead.length || hurt.length >= 2) : h.id === 'nyx' ? true : (fs.length >= 2 || boss); if (ok) return { k: 'ult', tgt: boss || weakest }; }
  if (h.id !== 'aldric' && fs.some(f => f.charging && f.prison === h)) return { k: 'guard' };
  if (h.hp < h.hpMax * .3 && !healer && S.items.pot > 0) return { k: 'item', item: 'pot', tgt: h };
  if (dead.length && !hs.some(x => x.id === 'selena' && x !== h && x.mp >= 18) && S.items.fea > 0 && h.id !== 'selena') return { k: 'item', item: 'fea', tgt: dead[0] };
  switch (h.id) {
    case 'selena':
      if (dead.length && can('raise')) return { k: 'raise', tgt: dead[0] };
      if (hurt.length && can('heal')) return { k: 'heal', tgt: hurt[0] };
      if (boss && boss.charging && !B.aegis && can('aegis')) return { k: 'aegis' };
      if (hs.filter(x => x.hp < x.hpMax * .75).length >= 2 && can('smite')) return { k: 'smite', tgt: fs.find(f => f.m.w.includes('foudre')) || weakest };
      if (can('smite') && h.mp > h.mpMax * .6) return { k: 'smite', tgt: boss || weakest };
      return { k: 'atk', tgt: weakest };
    case 'aldric':
      { const ch = fs.find(f => f.charging && !(f.boss && f.stunCd)); if (ch && can('bash')) return { k: 'bash', tgt: ch }; }
      { const ice = fs.find(f => f.st.freeze && f.hp > f.hpMax * .3); if (ice && can('bash')) return { k: 'bash', tgt: ice }; }
      if (h.rage >= 4 && boss) return { k: 'atk', tgt: boss };
      if (hs.length > 1 && !h.st.taunt && can('taunt') && (boss || hs.some(x => x !== h && x.hp < x.hpMax * .55))) return { k: 'taunt' };
      if (fs.length >= 2 && can('whirl')) return { k: 'whirl' };
      if (h.hp < h.hpMax * (healer ? .25 : .42) && can('rally')) return { k: 'rally' };
      if (hs.length === 1 && h.hp < h.hpMax * .35 && fs.length) return { k: 'guard' };
      return { k: 'atk', tgt: boss || weakest };
    case 'orin':
      if (h.mp < SK.fire.cost) return { k: 'focus' };
      { const combo = fs.find(f => (f.st.freeze || f.st.mark) && !f.m.r.includes('feu')); if (combo && can('fire') && (h.charge >= 3 || combo.hp > combo.hpMax * .3)) return { k: 'fire', tgt: combo }; }
      if (h.charge >= 3 && boss && can('fire') && !boss.m.r.includes('feu')) return { k: 'fire', tgt: boss };
      if (fs.length >= 2 && can('blizzard')) return { k: 'blizzard' };
      if (can('fire')) return { k: 'fire', tgt: fs.find(f => f.m.trait === 'rise' && !f.rose) || boss || weakest };
      return { k: 'atk', tgt: weakest };
    case 'lyra':
      if (boss && !boss.st.mark && can('aimed')) return { k: 'aimed', tgt: boss };
      if (fs.length >= 2 && can('rain')) return { k: 'rain' };
      if (boss && !boss.st.poison && !boss.m.r.includes('poison') && can('venom')) return { k: 'venom', tgt: boss };
      if (can('aimed')) return { k: 'aimed', tgt: boss || weakest };
      return { k: 'atk', tgt: weakest };
    case 'nyx': {
      const low = fs.find(f => f.hp < f.hpMax * (.35 + .05 * (f.st.sh || 0)) || (f.boss && (f.st.sh || 0) >= 4));
      if (low && can('assassin')) return { k: 'assassin', tgt: low };
      if (fs.length >= 2 && can('blades')) return { k: 'blades' };
      if (boss && boss.charging && can('shadow') && !h.st.dodge) return { k: 'shadow' };
      return { k: 'atk', tgt: weakest };
    }
  }
  return { k: 'atk', tgt: weakest };
}

// ---------- Simulator: ?sim plays the chapter on Auto and reports ----------
async function simCampaign(runs = 1, upto = 99) {
  const out = [];
  for (let r = 0; r < runs; r++) {
    S = fresh(); const log = [];
    for (let i = 0; i < Math.min(LEVELS.length, upto); i++) {
      let tries = 0, res;
      do { tries++; if (tries > 1 && tries % 2 === 0) autoShop(); res = await runLevel(i);
        if (res.win) { S.stars[i] = Math.max(S.stars[i], 1); const { xp, gold } = rewards(i, B.kills, true); S.gold += gold; grantXp(xp); lootChoice(makeChoice(i, LEVELS[i].boss, 0)); if (LEVELS[i].boss) lootChoice(makeChoice(i, true, 0, true, true)); rollLoot(i, LEVELS[i].boss, B.kills.filter(f => f.elite).length); autoEquip(); simSkills(); if (Math.random() < .4) S.items[Math.random() < .6 ? 'pot' : 'eth']++; recruit(i); }
        else { const { xp } = rewards(i, B.kills, false); grantXp(xp); }
      } while (!res.win && tries < 40);
      log.push({ lv: i + 1, tries, rounds: res.rounds, alive: res.alive, lvl: S.team.map(id => S.h[id].lvl).join('/'), gold: S.gold, pots: S.items.pot, hp: res.hpLeft });
      autoShop();
    }
    out.push(log);
  }
  return out;
}
function simSkills() { for (const id of Object.keys(S.own)) { const s = S.h[id], ks = HEROES[id].skills.concat('ult'); s.sk = s.sk || {}; let g = 50; while (ptsLeft(id) > 0 && g--) { const k = pick(ks); if ((s.sk[k] || 1) < 5) s.sk[k] = (s.sk[k] || 1) + 1; } } }
function autoShop() { for (const id of S.team) for (const k of ['w', 'a']) { const c = upCost(S.h[id][k]); if (S.gold >= c + 60) { S.gold -= c; S.h[id][k]++; } } while (S.gold >= 60 && S.items.pot < 3) { S.gold -= 30; S.items.pot++; } }
window.__db2 = { simCampaign, get B() { return B; }, get S() { return S; }, set S(v) { S = v; }, runLevel, HEROES, MON, SK, LEVELS, setFast: v => { FAST = v; }, SOLO };
})();
