<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Infinite Dungeon</title>
<link rel="apple-touch-icon" href="img/app_icon_180.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/app_icon_192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Infinite Dungeon">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="title" class="screen" aria-label="Accueil">
    <img id="titleBg" class="bg" alt="">
    <canvas id="titleCv" aria-hidden="true"></canvas>
    <div class="shade"></div>
    <header class="logo">
      <p class="kicker" id="kicker"></p>
      <h1 id="gameTitle"></h1>
      <p class="tagline" id="tagline"></p>
    </header>
    <button id="mute" class="icon-btn" type="button" aria-label="Couper le son">🔊</button>
    <div class="bottom">
      <button id="tapStart" class="tap" type="button">Toucher pour commencer</button>
      <nav id="menu" class="menu" hidden></nav>
      <p class="version" id="version"></p>
    </div>
  </section>
  <section id="view" class="screen view" hidden></section>
</main>
<div id="debug" class="debug" hidden></div>
<noscript><p class="noscript">Ce jeu a besoin de JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
