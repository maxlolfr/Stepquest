<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aldric — test v0.8</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b16;color:#f7e7c2;font-family:system-ui;text-align:center}main{max-width:480px;margin:auto;padding:24px 12px}h1{font-size:26px}p{color:#c5bdaf}.stage{position:relative;height:420px;overflow:hidden;border:1px solid #7b5d2b;border-radius:16px;background:radial-gradient(ellipse at 50% 65%,#554026,#111827 70%)}.hero{position:absolute;bottom:24px;left:50%;width:270px;height:360px;transform:translateX(-50%);transform-origin:50% 90%;object-fit:contain;filter:drop-shadow(0 0 12px #e3a94d55);animation:idle 2s ease-in-out infinite}.hero.attack{animation:attack .65s ease-in-out 1}.hero.guard{animation:guard .8s ease-in-out 1}.slash{position:absolute;left:20%;top:26%;width:60%;height:40%;border:8px solid transparent;border-top-color:#ffd36b;border-right-color:#ffbd43;border-radius:50%;transform:rotate(-35deg) scale(.5);opacity:0;pointer-events:none}.slash.active{animation:slash .65s ease-out}.buttons{display:flex;gap:8px;justify-content:center;margin:18px 0}button{border:1px solid #ad833f;background:#332619;color:#fff2cc;border-radius:10px;padding:13px;cursor:pointer}small{color:#aaa}@keyframes idle{50%{transform:translateX(-50%) translateY(-6px) scale(1.015)}}@keyframes attack{0%,100%{transform:translateX(-50%)}40%{transform:translateX(-57%) rotate(-8deg)}65%{transform:translateX(-40%) rotate(7deg)}}@keyframes guard{50%{transform:translateX(-50%) scale(.94);filter:drop-shadow(0 0 30px #ffcf54)}}@keyframes slash{30%{opacity:1;transform:rotate(12deg) scale(1)}100%{opacity:0;transform:rotate(45deg) scale(1.4)}}
</style></head><body><main><h1>Aldric — prototype v0.8</h1><p>Test d'affichage et de mouvement sur iPhone</p><div class="stage"><img class="hero" id="hero" src="../img/art_aldric.webp" alt="Aldric"><div class="slash" id="slash"></div></div><div class="buttons"><button id="idle">Repos</button><button id="attack">Attaque</button><button id="guard">Défense</button></div><small>Prototype technique avec l'illustration déjà présente dans le dépôt. La nouvelle planche animée n'est pas encore intégrée.</small></main><script>
const hero=document.getElementById('hero'),slash=document.getElementById('slash');let timer;function play(kind){clearTimeout(timer);hero.className='hero';slash.className='slash';void hero.offsetWidth;if(kind!=='idle'){hero.classList.add(kind);if(kind==='attack')slash.classList.add('active');timer=setTimeout(()=>{hero.className='hero';slash.className='slash'},kind==='attack'?650:800)}}for(const kind of ['idle','attack','guard'])document.getElementById(kind).onclick=()=>play(kind);
</script></body></html>
