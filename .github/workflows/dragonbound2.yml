name: Dragonbound II tests

on:
  push:
    paths:
      - 'prototype/dragonbound2/**'
      - 'prototype/dragonbound/**'
      - 'prototype/dragonbound-tests/**'
      - '.github/workflows/dragonbound2.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Run Dragonbound II tests
        working-directory: prototype/dragonbound-tests
        run: |
          export NODE_PATH=$(npm root -g)
          mkdir -p out
          fail=0
          # every test runs; a failing one is reported as an annotation (readable from the API) with its first error lines
          for t in "db2check.js out" db211.js db212.js db151.js db2close.js db2lot2.js db2lot3.js "db2ui.js out" db2lang.js; do
            if node $t > log.txt 2>&1; then echo "OK $t"; else fail=1; echo "::error title=$t::$(grep -m4 -E '❌|Error|Timeout|waiting for' log.txt | tr '\n' ' ' | cut -c1-900)"; fi
            cat log.txt
          done
          exit $fail
