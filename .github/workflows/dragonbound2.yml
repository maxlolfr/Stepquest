name: Dragonbound II tests

on:
  push:
    paths:
      - 'prototype/dragonbound2/**'
      - 'prototype/dragonbound/**'
      - 'prototype/dragonbound-tests/**'
      - '.github/workflows/dragonbound2.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Run Dragonbound II tests
        working-directory: prototype/dragonbound-tests
        run: |
          export NODE_PATH=$(npm root -g)
          mkdir -p out
          node db2check.js out
          node db211.js
          node db212.js
          node db151.js
          node db2close.js
          node db2lot2.js
          node db2ui.js out
