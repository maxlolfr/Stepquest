name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Generates the ios/, android/ and web/ folders that are not committed yet.
      # Existing files are never overwritten. The sample test it creates is removed.
      - name: Generate platform folders
        run: |
          flutter create . --platforms=ios,android,web --org com.stepquest --project-name stepquest
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter expanded
