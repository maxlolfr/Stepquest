name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Generates the ios/, android/ and web/ folders that are not committed yet.
      # Existing files are never overwritten. The sample test it creates is removed.
      - name: Generate platform folders
        run: |
          flutter create . --platforms=ios,android,web --org com.stepquest --project-name stepquest
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

  # Web preview of the prototype, published only when tests pass on main.
  web:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web folder
        run: flutter create . --platforms=web --org com.stepquest --project-name stepquest

      - name: Build web preview
        run: |
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/

      # Installable offline prototype of the island concept, served at /ile/.
      - name: Add island prototype
        run: |
          cp -r prototype/ile build/web/ile
          cp -r prototype/dragonbound build/web/dragonbound
          cp -r prototype/phaser build/web/phaser
          cp -r prototype/dragonbound2 build/web/dragonbound2
          cp -r prototype/infinite-dungeon build/web/infinite-dungeon

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
